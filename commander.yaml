commands:
  - title: Echo DB
    command: echo DB_URL=${DB_URL}
  - title: Ping
    command: ping -c 4 google.com
  - title: Parameter
    command: echo "{{.One}}-{{.Two}}-{{.Three}}"
    inputs:
      - key: One
        defaultValue: One
      - key: Two
        defaultValue: Two
      - key: Three
        defaultValue: Three
  - title: ls -la
    command: ls -la
  - title: Print working directory
    command: pwd
  - title: Check disk usage
    command: df -h
  - title: Deploy
    command: go build -o commander && mv commander ~/config/scripts
  - title: Dropdown
    command: echo "{{.Selected}}"
    inputs:
      - key: Selected
        choices:
          - One
          - Two
          - Three
  - title: Environment
    command: echo $ENV
    environment:
        ENV: "Hola"

environment:
  DB_URL: ./test.db
